name: Build mod dist

# Keep this workflow file: its run_number is the build counter across branches.
# main -> MAJOR.RUN.0 stable; every other branch -> MAJOR.RUN.0-beta.
on:
  push:
    branches: ['**']
    # Only inputs to the shipped mod should trigger an automatic release.
    paths:
      - 'src/**/*.cs'
      - 'Shared/RuntimeBootstrap.cs'
      - 'Assets/**'
      - '!Assets/**/*.md'
      - 'Purr2D2.csproj'
      - 'Purr2D2.slnx'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.Config'
      - 'nuget.config'
      - 'packages.lock.json'
      - 'mod.toml'
      - 'LICENSE'
      - 'release-major.txt'
      - 'tools/release-metadata.sh'
      - 'tools/stamp-release-version.py'
  pull_request:
    branches: [main]
    paths:
      - 'src/**/*.cs'
      - 'Shared/RuntimeBootstrap.cs'
      - 'Assets/**'
      - '!Assets/**/*.md'
      - 'Purr2D2.csproj'
      - 'Purr2D2.slnx'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.Config'
      - 'nuget.config'
      - 'packages.lock.json'
      - 'mod.toml'
      - 'LICENSE'
      - 'release-major.txt'
      - 'tools/release-metadata.sh'
      - 'tools/stamp-release-version.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify release policy offline
        run: python3 tools/check-release-policy.py

  build:
    needs: policy
    # Fork PRs can run policy checks without private game-assembly credentials.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.meta.outputs.publish }}
      channel: ${{ steps.meta.outputs.channel }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      title: ${{ steps.meta.outputs.title }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    env:
      KSA_DLL_DIR: ${{ github.workspace }}/.tmp/ksa-game-assemblies/current/dll
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Checkout private KSA assemblies
        uses: actions/checkout@v6
        with:
          repository: meow-sci/ksa-game-assemblies
          path: .tmp/ksa-game-assemblies
          token: ${{ secrets.KSA_GAME_ASSEMBLIES_PAT }}
          persist-credentials: false
          # Audited KSA 2026.11.10.5801 snapshot; update with compatibility reviews.
          ref: 4de698e8cf248c29fc95f188fb258775d6e574a3
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Compute release metadata
        id: meta
        run: bash tools/release-metadata.sh
      - name: Stamp project and manifest versions
        if: steps.meta.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: python3 tools/stamp-release-version.py "$VERSION"
      - name: Build solution and installable ZIP
        run: dotnet build Purr2D2.slnx -c Release -p:RestoreLockedMode=true --nologo -v quiet
      - name: Validate source and distribution
        run: python3 tools/validate.py --stage artifacts/stage/purr2d2
      - name: Runtime bootstrap regressions
        run: python3 tools/check_runtime_bootstrap.py --entry-assembly bin/Release/net10.0/Purr2D2.dll
      - name: Generated slice startup regressions
        run: python3 tools/check_fragment_templates.py --content-only
      - name: Verify release archive
        if: steps.meta.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: python3 tools/check-release-archive.py artifacts/stage/purr2d2 "artifacts/dist/purr2d2-$VERSION.zip"
      - name: Upload validated release assets
        if: steps.meta.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: purr2d2-release
          path: |
            artifacts/dist/*.zip
            artifacts/dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: purr2d2-release
          path: artifacts/dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          PURR2D2_DIST_DIR: ${{ github.workspace }}/artifacts/dist
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
          TITLE: ${{ needs.build.outputs.title }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: bash tools/publish-release.sh

  prune:
    needs: [build, publish]
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # All beta branches share one retention pool, serialized across branches.
    concurrency:
      group: rolling-release-cleanup-${{ needs.build.outputs.channel }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prune old releases and their tags
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          case "$CHANNEL" in
            main) KEEP=10 ;;
            beta) KEEP=5 ;;
            *) echo "Unknown release channel: $CHANNEL" >&2; exit 1 ;;
          esac
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | python3 tools/release-retention.py --channel "$CHANNEL" --keep "$KEEP" \
            > "$RUNNER_TEMP/purr2d2-stale-releases.txt"
          while IFS= read -r tag; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done < "$RUNNER_TEMP/purr2d2-stale-releases.txt"
